spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/book
    username: ${DB_USERNAME:book_svc}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.springframework.jdbc.datasource: WARN
    org.hibernate.engine.jdbc.env.internal: WARN
